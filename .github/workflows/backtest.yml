name: Backtest data
on:
  push:
    branches: [backtest]
    paths: [backtest/request.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/backtest-fetch.ts $(cat backtest/symbols.txt 2>/dev/null)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add backtest/data
          git commit -m "Backtest data $(date -u +%F)"
          git push
